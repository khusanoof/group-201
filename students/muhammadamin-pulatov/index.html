<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muhammadamin Pulatov — Group 201 portfolio sahifasi.">
  <meta name="theme-color" content="#fafafa">
  <title>Muhammadamin Pulatov</title>
  <style>
    :root {
      --ink: #181818;
      --muted: #727272;
      --line: #e7e7e7;
      --wash: #fafafa;
      --hover-bg: #181818;
      --hover-ink: #ffffff;
    }

    :root[data-theme="dark"] {
      --ink: #ffffff;
      --muted: #aaaaaa;
      --line: #242424;
      --wash: #000000;
      --hover-bg: #ffffff;
      --hover-ink: #000000;
      color-scheme: dark;
    }

    :root:not([data-theme="dark"]) {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    body,
    .project,
    .project::before,
    footer,
    .theme-toggle {
      transition-property: background, color, border-color;
      transition-duration: 500ms;
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 6px;
    }

    .shell {
      width: min(960px, calc(100% - 64px));
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      z-index: 10;
      top: 24px;
      right: 24px;
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--wash);
      color: var(--ink);
      cursor: pointer;
      transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
                  background 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .theme-toggle:hover {
      transform: rotate(12deg) scale(1.06);
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    main {
      min-height: calc(100vh - 72px);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      align-items: end;
      gap: 40px;
      min-height: 340px;
      padding: 64px 0 58px;
      border-bottom: 1px solid var(--line);
    }

    .intro h1 {
      max-width: 740px;
      margin: 0;
      font-size: clamp(54px, 8vw, 88px);
      font-weight: 600;
      letter-spacing: -0.075em;
      line-height: 0.92;
    }

    .intro h1 span {
      display: inline;
      margin-left: 12px;
      color: var(--muted);
      font-size: clamp(28px, 4.5vw, 46px);
      font-weight: 700;
      letter-spacing: -0.055em;
      white-space: nowrap;
      vertical-align: 12%;
    }

    .meta {
      display: grid;
      gap: 12px;
      padding-bottom: 7px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .meta-label {
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .works {
      padding: 38px 0 64px;
    }

    .works-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .works-heading h2,
    .works-heading p {
      margin: 0;
      font-size: 14px;
    }

    .works-heading h2 {
      font-weight: 700;
    }

    .works-heading p {
      color: var(--muted);
    }

    .project {
      display: grid;
      position: relative;
      grid-template-columns: 76px minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 18px;
      min-height: 108px;
      overflow: hidden;
      border-top: 1px solid var(--line);
      isolation: isolate;
    }

    .project::before {
      position: absolute;
      z-index: -1;
      inset: 5px -20%;
      background: var(--hover-bg);
      content: "";
      transform: skewY(-2deg) scaleX(0);
      transform-origin: right;
      transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover::before {
      transform: skewY(-2deg) scaleX(1);
      transform-origin: left;
    }

    .project:hover {
      color: var(--hover-ink);
      border-color: var(--hover-bg);
    }

    .project:hover .project-number,
    .project:hover .project-kind,
    .project:hover .project-arrow {
      color: var(--hover-ink);
    }

    .project:last-child {
      border-bottom: 1px solid var(--line);
    }

    .project-number,
    .project-kind {
      color: var(--muted);
      font-size: 13px;
    }

    .project-number {
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .project-name {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project-arrow {
      font-size: 22px;
      transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .project:hover .project-name {
      transform: translateX(10px);
    }

    .project:hover .project-arrow {
      transform: translateX(7px);
    }

    footer {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      transition: color 180ms ease;
    }

    footer a:hover {
      color: var(--ink);
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .social-links a {
      position: relative;
    }

    .social-links a::after {
      position: absolute;
      right: 0;
      bottom: -4px;
      left: 0;
      height: 1px;
      background: var(--ink);
      content: "";
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .social-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .intro,
    .works {
      animation: reveal 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .works {
      animation-delay: 100ms;
    }

    .project {
      opacity: 0;
      animation: project-reveal 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .project:nth-of-type(1) {
      animation-delay: 220ms;
    }

    .project:nth-of-type(2) {
      animation-delay: 320ms;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes project-reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      .shell {
        width: min(100% - 36px, 960px);
      }

      main {
        min-height: calc(100vh - 64px);
      }

      .intro {
        grid-template-columns: 1fr;
        align-items: end;
        gap: 30px;
        min-height: 300px;
        padding: 52px 0 42px;
      }

      .intro h1 {
        font-size: clamp(48px, 15vw, 68px);
      }

      .intro h1 span {
        display: block;
        margin-top: 18px;
        margin-left: 0;
        font-size: clamp(30px, 9vw, 42px);
      }

      .meta {
        grid-template-columns: auto 1fr;
        align-items: baseline;
        gap: 12px;
      }

      .theme-toggle {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
      }

      .project {
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        gap: 12px;
        min-height: 92px;
      }

      .project-number {
        font-size: 24px;
      }

      .project-name {
        font-size: 20px;
      }

      .project-kind {
        display: none;
      }

      footer {
        min-height: 64px;
      }
    }

    @media (max-width: 380px) {
      .shell {
        width: min(100% - 28px, 960px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Qorong‘i rejimni yoqish" title="Rang rejimini almashtirish">
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M18.36 5.64l-1.42 1.42M7.06 16.94l-1.42 1.42"/>
      <circle cx="12" cy="12" r="4"/>
    </svg>
  </button>
  <div class="shell">
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">Muhammadamin<br>Pulatov <span>Group 201</span></h1>
        <div class="meta">
          <span class="meta-label">Web dasturlash</span>
          <span>HTML · CSS · Portfolio</span>
        </div>
      </section>

      <section class="works" id="works" aria-labelledby="works-title">
        <div class="works-heading">
          <h2 id="works-title">Loyihalar</h2>
          <p>2 ish</p>
        </div>

        <a class="project" href="./FlexBox/index.html">
          <span class="project-number">01</span>
          <span class="project-name">Flexbox mashqlari</span>
          <span class="project-kind">HTML / CSS</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>

        <a class="project" href="./ipak-yoli/index.html">
          <span class="project-number">02</span>
          <span class="project-name">Ipak yo‘li Tours</span>
          <span class="project-kind">Sayohat sahifasi</span>
          <span class="project-arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026</span>
      <div class="social-links">
        <a href="https://github.com/MuhammadaminPulatov" target="_blank" rel="noopener noreferrer" aria-label="Muhammadamin Pulatov GitHub profili">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.91-2.78.61-3.37-1.2-3.37-1.2-.45-1.18-1.11-1.49-1.11-1.49-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.64-1.35-2.22-.26-4.56-1.13-4.56-5.02 0-1.11.39-2.02 1.03-2.73-.1-.26-.45-1.29.1-2.69 0 0 .84-.27 2.75 1.04A9.4 9.4 0 0 1 12 7.9c.85 0 1.71.12 2.51.34 1.9-1.31 2.74-1.04 2.74-1.04.55 1.4.2 2.43.1 2.69.64.71 1.03 1.62 1.03 2.73 0 3.9-2.34 4.76-4.57 5.01.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.2 10.2 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/>
          </svg>
        </a>
        <a href="../../">Guruh 201</a>
      </div>
    </footer>
  </div>
  <script>
    const root = document.documentElement;
    const themeToggle = document.querySelector(".theme-toggle");
    const savedTheme = localStorage.getItem("portfolio-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const startTheme = savedTheme || (prefersDark ? "dark" : "light");

    function applyTheme(theme) {
      root.dataset.theme = theme;
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Yorug‘ rejimga o‘tish" : "Qorong‘i rejimga o‘tish"
      );
      themeToggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
      document.querySelector('meta[name="theme-color"]').setAttribute(
        "content",
        theme === "dark" ? "#000000" : "#fafafa"
      );
    }

    applyTheme(startTheme);

    themeToggle.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("portfolio-theme", nextTheme);
      applyTheme(nextTheme);
    });
  </script>
</body>
</html>
